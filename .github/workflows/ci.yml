name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Belt-and-braces secret scan (the pre-commit hook is a local, per-commit gate
  # that only sees staged content; this sees ALL history on every push).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history so the scan sees every commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks (all history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1

  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Install PlatformIO via pip rather than the platformio/action-ci action:
    # that action no longer resolves (repository not found), which broke this job
    # on the first real CI run. Pinned to match the local toolchain.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install PlatformIO Core
      run: pip install platformio==6.1.19

    - name: Build firmware
      run: pio run -e s3
      working-directory: firmware

    - name: Setup CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        cmake --version

    - name: Configure host tests
      run: |
        cmake -S firmware/test -B firmware/test/build -G Ninja

    - name: Build host tests
      run: |
        cmake --build firmware/test/build

    - name: Run host tests
      run: |
        ctest --test-dir firmware/test/build --output-on-failure

    - name: Verify render ledger
      run: |
        pip install pillow
        python tools/verify_all.py --skip-firmware

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup clang-format
      run: |
        # Pin the exact version via PyPI rather than apt: the runner's
        # clang-format differed from the local one and reported violations in code
        # that was already formatted, so the gate was not reproducible. 23.1.1 is
        # also what the project is formatted with locally.
        pip install clang-format==23.1.1

    - name: Check C++ formatting
      run: |
        # Scope to TRACKED, top-level firmware/src files. Two reasons this is not a
        # shell glob:
        #  1. `firmware/src/*.h` also matches the gitignored secrets.h, which a
        #     developer has locally but CI never does — so a glob makes the check
        #     disagree between environments AND makes clang-format print the
        #     offending lines, i.e. real credentials, to the terminal.
        #  2. git's pathspec `*` matches across '/', so a plain 'firmware/src/*.cpp'
        #     recurses into every subdirectory (fonts/, net/, text/, draw/) and
        #     drags in the auto-generated font tables, which are machine-written by
        #     tools/font_convert.py and must never be reformatted.
        # `:(glob)` makes '*' stop at a path separator, reproducing the original
        # top-level-only scope without matching secrets.h.
        FILES=$(git ls-files ':(glob)firmware/src/*.cpp' ':(glob)firmware/src/*.h')
        echo "checking:"; echo "$FILES"
        clang-format --dry-run --Werror -style=file $FILES

    # NOTE: this gate covers ONLY top-level firmware/src. The modules under
    # draw/, net/, sched/ and text/ are not checked, and the four font tables are
    # deliberately excluded (generated). Widening the scope is a separate change
    # because it requires reformatting those files first.

    - name: Check Python formatting
      run: |
        pip install black flake8
        black --check --line-length 100 tools/
        flake8 tools/ --max-line-length 100
