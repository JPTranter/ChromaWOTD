[platformio]
default_envs = s3
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3]
platform = espressif32
; EE05 ships the XIAO ESP32-S3 Plus; stock PlatformIO has no Plus board def.
; seeed_xiao_esp32s3 is pin-compatible here because Seeed GFX addresses the
; panel pins by raw GPIO number (EPaper_Board_Pins_Setups.h), not board Dxx.
board = seeed_xiao_esp32s3
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCHROMAWOTD=1
    -DCORE_DEBUG_LEVEL=1
    ; Setup defines must be global so the library's headers (TFT_eSPI.h) select
    ; the same panel/board config in every TU that sees them.
    -DBOARD_SCREEN_COMBO=512
    -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE05
; Seeed_GFX is an Arduino flat-layout library: only root TFT_eSPI.cpp is a TU and
; it #includes Processors/Extensions/Touch_Drivers itself, so main.cpp includes
; "TFT_eSPI.cpp" wholesale. No subfolder exclusion is needed (and no exclusion
; CONFIG exists): PlatformIO compiles only the root directory of legacy-layout
; libraries, which is why the build emits a single Seeed_GFX object. An earlier
; `lib_build_src_filter` line here was ignored — PlatformIO does not have that
; option and printed "Ignore unknown configuration option" on every build.

