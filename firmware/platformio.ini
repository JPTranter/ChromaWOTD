[platformio]
default_envs = s3
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3]
platform = espressif32
; EE05 ships the XIAO ESP32-S3 Plus; stock PlatformIO has no Plus board def.
; seeed_xiao_esp32s3 is pin-compatible here because Seeed GFX addresses the
; panel pins by raw GPIO number (EPaper_Board_Pins_Setups.h), not board Dxx.
board = seeed_xiao_esp32s3
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCHROMAWOTD=1
    -DCORE_DEBUG_LEVEL=1
    ; Setup defines must be global so the library's headers (TFT_eSPI.h) select
    ; the same panel/board config in every TU that sees them.
    -DBOARD_SCREEN_COMBO=512
    -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE05
    ; FreeSans 6pt GFX font (descenders) instead of the built-in 5x7. Enabling
    ; this also requires LOAD_GFXFF on the Seeed_GFX font path; see
    ; firmware/src/fonts/FreeSans6pt7b.h and tools/font_convert.py. Comment out
    ; to return to 5x7.
    -DCHROMAWOTD_FONT_FREESANS=1
    ; Phase 3: enable the network path (Wi-Fi + TLS fetch). Requires
    ; firmware/src/secrets.h (gitignored) with WIFI_SSID/WIFI_PASSPHRASE set.
    ; Comment out to keep the offline/fallback-only build.
    -DCHROMAWOTD_NETWORK=1
    ; Phase 4: deep sleep between scheduled refreshes (06:30 / 12:30 / 18:00).
    ; Comment out to keep the device awake for debugging (loop() then idles and
    ; never redraws; pair with CHROMAWOTD_DEBUG_DELAY for monitor attach time).
    -DCHROMAWOTD_DEEP_SLEEP=1
    ; Wall-clock button wake (BUTTON1/2/3 = GPIO2/3/5 via ext1). OFF until the
    ; pin behaviour is confirmed on hardware: on a board where those pads do not
    ; idle HIGH this causes a deep-sleep wake storm. See main.cpp.
    ;-DCHROMAWOTD_BUTTON_WAKE=1
    ; Network identity: the DHCP hostname "ChromaWOTD" is always set (visible in
    ; the router's client list). Optional mDNS (uncomment) also answers to
    ; "ChromaWOTD.local" — cheap, ~24 KB flash / ~2 KB RAM.
    ;-DCHROMAWOTD_MDNS=1
    ; Optional hostname override (default "ChromaWOTD"), if you ever need it:
    ;-DCHROMAWOTD_HOSTNAME='"ChromaWOTD"'
    ; Uncomment for a 3 s post-boot delay so a serial monitor can attach.
    ;-DCHROMAWOTD_DEBUG_DELAY=1
    ; Bring-up helper: force a fixed short sleep to observe timer wake on the
    ; bench. Never set in production. Example: 90 -> wakes every 90 s.
    ;-DCHROMAWOTD_WAKE_TEST_SEC=90
    ; NOTE: the TLS handshake needs more stack than the default loopTask (see
    ; STACK NOTE in main.cpp) — main.cpp runs the sync phase on a dedicated
    ; FreeRTOS task with an explicit 16 KB stack, so no build_flags/sdkconfig
    ; override is needed here.
; Seeed_GFX is an Arduino flat-layout library: only root TFT_eSPI.cpp is a TU and
; it #includes Processors/Extensions/Touch_Drivers itself, so main.cpp includes
; "TFT_eSPI.cpp" wholesale. No subfolder exclusion is needed (and no exclusion
; CONFIG exists): PlatformIO compiles only the root directory of legacy-layout
; libraries, which is why the build emits a single Seeed_GFX object. An earlier
; `lib_build_src_filter` line here was ignored — PlatformIO does not have that
; option and printed "Ignore unknown configuration option" on every build.