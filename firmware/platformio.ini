[platformio]
default_envs = s3
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

[env:s3]
platform = espressif32
board = seeed_xiao_esp32s3
lib_deps =
    zinggjm/GxEPD2@^1.5.3
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCHROMACLOCK=1
    -DCORE_DEBUG_LEVEL=1
