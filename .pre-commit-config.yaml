# Pre-commit configuration — https://pre-commit.com
#
# Hooks run against staged content on every commit. The primary security hook is
# gitleaks (secret scanning); the rest are lightweight hygiene checks.
# Idempotent hooks can auto-fix with: pre-commit run --all-files
#
# Install once:   pip install pre-commit
# Install hooks:  pre-commit install
# Run now:        pre-commit run --all-files
#
# NOTE on first use: the end-of-file-fixer hook rewrites files that lack a
# trailing newline, so the FIRST commit attempt can fail after it fixes them.
# That is normal — `git add -A && git commit` again passes on the second try.

repos:
  # Secret scanning (the important one). Scans staged content for credentials,
  # tokens, private keys, API keys, etc. Blocks the commit on a match.
  # https://github.com/gitleaks/gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # Basic hygiene (auto-fixable).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # .clang-format is YAML-ish but leads with '#' comments and a bare
        # "Language:" preamble line that PyYAML rejects ("mapping values are not
        # allowed here"). It is a clang-format config, not a workflow file.
        exclude: ^\.clang-format$
      - id: check-added-large-files    # catch accidentally-committed binaries
      - id: check-merge-conflict
      - id: detect-private-key         # blocks a committed private key outright
